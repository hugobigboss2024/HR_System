server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hrm_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Hong_Kong
    username: root
    password: your_mysql_password
  data:
    redis:
      host: localhost
      port: 6379
      password: 

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true 
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl 